openapi: 3.1.0
info:
  title: 알바생 노동권 지킴이 API
  version: 0.2.0
  description: '프론트엔드 ↔ 백엔드 계약. 이 파일이 API의 기준(Single Source of Truth)이다.

    각 operation의 `x-spec-id`는 docs/spec/03-api-spec.md의 API-xx, `x-fs`는 기능 명세 ID.

    모든 JSON 응답은 공통 형식 {success, data} / {success:false, error:{code,message}}. 응답 헤더 X-Request-ID.

    '
servers:
- url: /api
tags:
- name: health
- name: wage
- name: contracts
- name: recordings
- name: ask
- name: media
- name: qa
paths:
  /health:
    get:
      tags:
      - health
      operationId: getHealth
      x-spec-id: API-01
      summary: 헬스체크
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/Health'
  /wage/check:
    post:
      tags:
      - wage
      operationId: checkWage
      x-spec-id: API-02
      x-fs:
      - FS-01
      - BR-03
      - BR-04
      summary: 최저임금 충족 여부·주휴수당 계산 (코드 계산)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WageCheckRequest'
      responses:
        '200':
          description: 계산 결과
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/WageCheckResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
  /contracts/ocr:
    post:
      tags:
      - contracts
      operationId: ocrContract
      x-spec-id: API-03
      x-fs:
      - FS-01
      - BR-01
      - BR-02
      summary: 계약서·명세서 이미지 → 텍스트·필드 추출
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: jpg/png/pdf, 10MB 이하
                doc_type:
                  type: string
                  enum:
                  - contract
                  - payslip
                  default: contract
      responses:
        '200':
          description: 추출 결과 (원본은 삭제됨)
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/OcrResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          description: 파일 크기 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          $ref: '#/components/responses/UpstreamError'
  /contracts/review:
    post:
      tags:
      - contracts
      operationId: reviewContract
      x-spec-id: API-04
      x-fs:
      - FS-01
      - BR-03
      - BR-04
      - BR-05
      - BR-06
      summary: 확정된 필드 → 계산 + 근거 기반 설명
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        '200':
          description: 점검 결과
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/ReviewResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
  /recordings:
    post:
      tags:
      - recordings
      operationId: createRecordingJob
      x-spec-id: API-05
      x-fs:
      - FS-02
      - BR-07
      summary: 녹음 업로드 → 장문 인식 작업 생성
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - consent
              properties:
                file:
                  type: string
                  format: binary
                  description: m4a/mp3/wav, 50MB 이하
                consent:
                  type: boolean
                  description: 녹음 관련 주의 문구 동의 (true만 허용)
      responses:
        '202':
          description: 작업 생성됨
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/RecordingJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          description: 파일 크기 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /recordings/{job_id}:
    get:
      tags:
      - recordings
      operationId: getRecordingJob
      x-spec-id: API-06
      x-fs:
      - FS-02
      - BR-08
      - BR-09
      - BR-10
      summary: 인식 상태·타임라인 조회 (폴링)
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 작업 상태
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/RecordingJob'
        '404':
          description: 작업 없음(만료 포함)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /ask/voice:
    post:
      tags:
      - ask
      operationId: askByVoice
      x-spec-id: API-07
      x-fs:
      - FS-03
      - BR-11
      - BR-12
      - BR-13
      summary: 음성 질문 → CSR → Chatbot/Studio 라우팅
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: 60초 이하 음성
      responses:
        '200':
          description: 답변
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/AskResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          $ref: '#/components/responses/UpstreamError'
  /ask/text:
    post:
      tags:
      - ask
      operationId: askByText
      x-spec-id: API-08
      x-fs:
      - FS-03
      - BR-11
      summary: 텍스트 질문 (음성 실패 대비)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - question
              properties:
                question:
                  type: string
                  minLength: 2
                  maxLength: 300
      responses:
        '200':
          description: 답변
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/AskResult'
        '422':
          $ref: '#/components/responses/ValidationError'
  /tts:
    post:
      tags:
      - media
      operationId: textToSpeech
      x-spec-id: API-09
      x-fs:
      - FS-01
      - FS-03
      summary: 텍스트 → CLOVA Voice 음성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - text
              properties:
                text:
                  type: string
                  maxLength: 1000
                lang:
                  $ref: '#/components/schemas/Lang'
      responses:
        '200':
          description: mp3 음성
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        '502':
          $ref: '#/components/responses/UpstreamError'
  /translate:
    post:
      tags:
      - media
      operationId: translate
      x-spec-id: API-10
      x-fs:
      - FS-04
      summary: Papago 번역 (여러 문장)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - texts
              - target
              properties:
                texts:
                  type: array
                  items:
                    type: string
                  maxItems: 30
                target:
                  $ref: '#/components/schemas/Lang'
      responses:
        '200':
          description: 번역 결과 (입력 순서 유지)
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    required:
                    - texts
                    - target
                    properties:
                      texts:
                        type: array
                        items:
                          type: string
                      target:
                        $ref: '#/components/schemas/Lang'
        '502':
          $ref: '#/components/responses/UpstreamError'
  /qa/search:
    get:
      tags:
      - qa
      operationId: searchLawQa
      x-spec-id: API-11
      x-fs:
      - FS-06
      summary: 백문백답(근로자 분야) 키워드 검색
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      - name: limit
        in: query
        schema:
          type: integer
          default: 3
          maximum: 10
      responses:
        '200':
          description: 검색 결과
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    required:
                    - items
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Source'
components:
  responses:
    BadRequest:
      description: 잘못된 요청 (형식·업무 규칙 위반)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: 요청 형식 검증 실패 (code=VALIDATION_ERROR)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UpstreamError:
      description: 외부 AI/공공 API 호출 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
      - success
      - error
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: 오류 코드 (03-api-spec 오류 코드 표)
            message:
              type: string
              description: 사용자에게 보여줄 수 있는 한국어 메시지
            details:
              description: 검증 오류 상세 등 (선택)
    Health:
      type: object
      required:
      - status
      - version
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          example: 0.1.0
    Lang:
      type: string
      enum:
      - ko
      - en
      - vi
      - zh-CN
      default: ko
    WageCheckRequest:
      type: object
      required:
      - hourly_wage
      - weekly_hours
      properties:
        hourly_wage:
          type: integer
          minimum: 0
          description: 시급(원)
        weekly_hours:
          type: number
          minimum: 0
          maximum: 168
          description: 주 소정근로시간
        year:
          type: integer
          description: 적용 연도. 생략 시 요청 시점의 연도 (BR-03)
    WageCheckResult:
      type: object
      required:
      - year
      - minimum_hourly
      - notice
      - hourly_wage
      - meets_minimum
      - shortfall_per_hour
      - weekly_hours
      - weekly_holiday_eligible
      - weekly_holiday_hours
      - weekly_holiday_pay
      properties:
        year:
          type: integer
        minimum_hourly:
          type: integer
          description: 고시 최저시급
        notice:
          type: string
          description: 고시 근거
        hourly_wage:
          type: integer
        meets_minimum:
          type: boolean
        shortfall_per_hour:
          type: integer
        weekly_hours:
          type: number
        weekly_holiday_eligible:
          type: boolean
        weekly_holiday_hours:
          type: number
        weekly_holiday_pay:
          type: integer
    ExtractedField:
      type: object
      required:
      - value
      - confidence
      properties:
        value:
          description: 추출 값. 못 찾으면 null
        confidence:
          type: string
          enum:
          - high
          - low
        source_text:
          type: string
          description: 근거가 된 OCR 원문 조각
    OcrResult:
      type: object
      required:
      - doc_type
      - raw_text
      - extracted
      properties:
        doc_type:
          type: string
          enum:
          - contract
          - payslip
        raw_text:
          type: string
        extracted:
          type: object
          properties:
            hourly_wage:
              $ref: '#/components/schemas/ExtractedField'
            weekly_hours:
              $ref: '#/components/schemas/ExtractedField'
            work_days:
              $ref: '#/components/schemas/ExtractedField'
            break_minutes:
              $ref: '#/components/schemas/ExtractedField'
    ReviewRequest:
      type: object
      required:
      - hourly_wage
      - weekly_hours
      properties:
        hourly_wage:
          type: integer
          minimum: 0
        weekly_hours:
          type: number
          minimum: 0
          maximum: 168
        work_days:
          type: array
          items:
            type: string
            enum:
            - 월
            - 화
            - 수
            - 목
            - 금
            - 토
            - 일
        break_minutes:
          type: integer
          minimum: 0
        year:
          type: integer
        lang:
          $ref: '#/components/schemas/Lang'
    Source:
      type: object
      required:
      - id
      - title
      properties:
        id:
          type: string
          description: 백문백답 문항 식별자
        title:
          type: string
        snippet:
          type: string
        url:
          type: string
    CheckItem:
      type: object
      required:
      - level
      - title
      - description
      properties:
        level:
          type: string
          enum:
          - ok
          - check
          description: ok=문제 없음, check=확인 필요
        title:
          type: string
        description:
          type: string
    ReviewResult:
      type: object
      required:
      - calculation
      - items
      - sources
      - disclaimer
      properties:
        calculation:
          $ref: '#/components/schemas/WageCheckResult'
        items:
          type: array
          items:
            $ref: '#/components/schemas/CheckItem'
        explanation:
          type:
          - string
          - 'null'
          description: Studio 설명. 실패 시 null
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
        disclaimer:
          type: string
    SpeechSegmentEntry:
      type: object
      required:
      - start_ms
      - end_ms
      - speaker
      - text
      properties:
        start_ms:
          type: integer
        end_ms:
          type: integer
        speaker:
          type: string
          example: 화자 A
        text:
          type: string
    TimelineEntry:
      type: object
      required:
      - start_ms
      - speaker
      - text
      - category
      properties:
        start_ms:
          type: integer
        speaker:
          type: string
          example: 화자 A
        text:
          type: string
        category:
          type: string
          enum:
          - 임금
          - 근무시간
          - 휴게·휴일
          - 약속·지시
          - 기타
    RecordingJob:
      type: object
      required:
      - job_id
      - status
      properties:
        job_id:
          type: string
        status:
          type: string
          enum:
          - queued
          - processing
          - done
          - failed
        error:
          type:
          - string
          - 'null'
        duration_sec:
          type:
          - integer
          - 'null'
        speakers:
          type: array
          items:
            type: string
        segments:
          type: array
          items:
            $ref: '#/components/schemas/SpeechSegmentEntry'
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEntry'
        transcript:
          type:
          - string
          - 'null'
    AskResult:
      type: object
      required:
      - question
      - route
      - answer
      - sources
      properties:
        question:
          type: string
          description: 인식된 질문 텍스트
        route:
          type: string
          enum:
          - faq
          - studio
          - none
        answer:
          type: string
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
