# NCP Server에서 사용하는 운영용 compose. CD 워크플로가 /opt/albalaw-guard 로 복사한다.
# IMAGE_REGISTRY, IMAGE_TAG 는 CD가 .deploy.env 로 주입한다.
services:
  backend:
    image: ${IMAGE_REGISTRY}/albalaw-backend:${IMAGE_TAG}
    env_file: ./backend.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    image: ${IMAGE_REGISTRY}/albalaw-frontend:${IMAGE_TAG}
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # infra/tls/setup-ip-cert.sh가 발급·갱신하는 Let's Encrypt IP 인증서
      - ./certs:/etc/nginx/certs:ro
      - ./acme-webroot:/var/www/acme:ro
    restart: unless-stopped
